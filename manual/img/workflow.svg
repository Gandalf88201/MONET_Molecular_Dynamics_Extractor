<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>MONET workflow: from the trajectory to the QM inputs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a607b"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- column titles -->
  <text x="40" y="34" font-size="15" font-weight="700" fill="#1b1f31">Prepare</text>
  <text x="330" y="34" font-size="15" font-weight="700" fill="#1b1f31">Decide what is independent</text>
  <text x="640" y="34" font-size="15" font-weight="700" fill="#1b1f31">Extract</text>

  <!-- Prepare -->
  <g font-size="13" fill="#1b1f31">
    <rect x="30" y="52" width="250" height="62" rx="9" fill="#eceef6" stroke="#aab0c6"/>
    <text x="46" y="76" font-weight="700">1 · Load the trajectory</text>
    <text x="46" y="97">File input (step 01) · section 3</text>

    <rect x="30" y="140" width="250" height="62" rx="9" fill="#eceef6" stroke="#aab0c6"/>
    <text x="46" y="164" font-weight="700">2 · Check the atoms</text>
    <text x="46" y="185">Topology &amp; consistency · 3.3</text>

    <rect x="30" y="228" width="250" height="62" rx="9" fill="#eceef6" stroke="#aab0c6"/>
    <text x="46" y="252" font-weight="700">3 · Cell and time axis</text>
    <text x="46" y="273">minimum image, time step · 4.4, 4.5</text>

    <rect x="30" y="316" width="250" height="62" rx="9" fill="#eceef6" stroke="#aab0c6"/>
    <text x="46" y="340" font-weight="700">4 · Look at it</text>
    <text x="46" y="361">viewer and player · 4.1–4.3, 4.6</text>
  </g>

  <!-- Decide -->
  <g font-size="13" fill="#1b1f31">
    <rect x="320" y="52" width="260" height="62" rx="9" fill="#fbe9ed" stroke="#c8243f"/>
    <text x="336" y="76" font-weight="700">5 · Is it equilibrated?</text>
    <text x="336" y="97">Detect equilibration → t₀ · 6.1</text>

    <rect x="320" y="140" width="260" height="62" rx="9" fill="#fbe9ed" stroke="#c8243f"/>
    <text x="336" y="164" font-weight="700">6 · How correlated is it?</text>
    <text x="336" y="185">Autocorrelation → τ, t*, stride · 6.2</text>

    <rect x="320" y="228" width="260" height="62" rx="9" fill="#fbe9ed" stroke="#c8243f"/>
    <text x="336" y="252" font-weight="700">7 · Uncorrelated trajectory</text>
    <text x="336" y="273">Accept t* → becomes active · 6.3</text>

    <rect x="320" y="330" width="260" height="96" rx="9" fill="#ffffff" stroke="#aab0c6" stroke-dasharray="5 4"/>
    <text x="336" y="354" font-weight="700">On the full-resolution run</text>
    <text x="336" y="376">geometry, fluctuations, RDF,</text>
    <text x="336" y="396">MSD, VDOS, MDAnalysis</text>
    <text x="336" y="416">sections 5, 6.4–6.9, 7</text>
  </g>

  <!-- Extract -->
  <g font-size="13" fill="#1b1f31">
    <rect x="630" y="52" width="240" height="62" rx="9" fill="#dbe8f8" stroke="#1d64a8"/>
    <text x="646" y="76" font-weight="700">8 · Sampling (step 03)</text>
    <text x="646" y="97">every N-th frame · 9.2</text>

    <rect x="630" y="140" width="240" height="62" rx="9" fill="#dbe8f8" stroke="#1d64a8"/>
    <text x="646" y="164" font-weight="700">9 · Atom selection (04)</text>
    <text x="646" y="185">which atoms to keep · 9.3</text>

    <rect x="630" y="228" width="240" height="62" rx="9" fill="#dbe8f8" stroke="#1d64a8"/>
    <text x="646" y="252" font-weight="700">10 · Options, QM inputs (05)</text>
    <text x="646" y="273">codes, charge, spin · 9.4</text>

    <rect x="630" y="316" width="240" height="62" rx="9" fill="#dbe8f8" stroke="#1d64a8"/>
    <text x="646" y="340" font-weight="700">11 · Run and download</text>
    <text x="646" y="361">steps 06–07 · 9.5</text>
  </g>

  <!-- arrows: prepare column -->
  <g stroke="#5a607b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M155 114 V138"/>
    <path d="M155 202 V226"/>
    <path d="M155 290 V314"/>
    <path d="M280 347 C300 347 300 83 318 83"/>
    <path d="M450 114 V138"/>
    <path d="M450 202 V226"/>
    <path d="M580 259 C605 259 605 83 628 83"/>
    <path d="M750 114 V138"/>
    <path d="M750 202 V226"/>
    <path d="M750 290 V314"/>
    <path d="M450 290 V328" stroke-dasharray="4 4"/>
  </g>
  <text x="586" y="176" font-size="12" fill="#5a607b" transform="rotate(-90 586 176)">stride = 1</text>

  <!-- the record -->
  <rect x="30" y="458" width="840" height="74" rx="9" fill="#f4f5fa" stroke="#aab0c6"/>
  <text x="46" y="484" font-size="13" font-weight="700" fill="#1b1f31">12 · The record, all along</text>
  <text x="46" y="506" font-size="13" fill="#1b1f31">History logs every step that changes a result (file checksum, cell, time axis, parameters, key numbers);</text>
  <text x="46" y="524" font-size="13" fill="#1b1f31">Save session gives methods.md and replay.py, ⓘ References what to cite · section 10</text>
</svg>
