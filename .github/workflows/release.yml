name: release

# Push a tag (v2.1.0, or a named tag such as monet-pub) to publish a GitHub release
# for the version in CITATION.cff (source ZIP included by GitHub).
# With the repository enabled in Zenodo, each release is archived and receives a DOI.
on:
  push:
    tags: ['v*', 'monet-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(sed -n 's/^version: *//p' CITATION.cff)
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          # v2.3.1 and v.2.3.1 both name version 2.3.1.
          case "$GITHUB_REF_NAME" in v*) tag=${GITHUB_REF_NAME#v}; test "${tag#.}" = "$version" || { echo "Tag $GITHUB_REF_NAME and CITATION.cff version ($version) differ"; exit 1; } ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created by hand (which also pushes the tag) is left as it is.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME already exists."; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --title "MONET $VERSION ($GITHUB_REF_NAME)" --notes-file notes.md --verify-tag
