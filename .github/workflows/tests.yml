name: tests

on:
  push:
    branches: [master, v2-ase]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install DOM test dependencies
        run: npm install --no-save --ignore-scripts jsdom @napi-rs/canvas
      - name: Run test suites
        env:
          PYTHON: python
        run: |
          node tests/regression.cjs
          node tests/qm-parity.cjs
          node tests/formats.cjs
          node tests/analysis.cjs
          node tests/mdanalysis.cjs
          node tests/ase-integration.cjs
          node tests/ase-ui.cjs
