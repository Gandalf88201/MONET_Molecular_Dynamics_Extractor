name: tests

on:
  push:
    branches: [master, v2-ase]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install DOM test dependencies
        run: npm install --no-save --ignore-scripts jsdom @napi-rs/canvas
      - name: Run test suites
        env:
          PYTHON: python
        run: |
          node tests/regression.cjs
          node tests/qm-parity.cjs
          node tests/formats.cjs
          node tests/analysis.cjs
          node tests/mdanalysis.cjs
          node tests/ase-integration.cjs
          node tests/ase-ui.cjs

  launchers:
    # The double-click launchers create the environment on every platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up with start_monet.command
        if: runner.os != 'Windows'
        env:
          MONET_SETUP_ONLY: '1'
        run: ./start_monet.command && ./start_monet.command
      - name: Set up with start_monet.bat
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MONET_SETUP_ONLY: '1'
        run: start_monet.bat && start_monet.bat
      - name: Launcher answers on its local port
        shell: bash
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          "$py" start_monet.py --no-browser --port 8799 > launcher.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q MONET
          kill $pid || true

  citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CITATION.cff
        run: |
          python -m pip install cffconvert
          cffconvert --validate
